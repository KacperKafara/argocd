apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
spec:
  sources:
    - chart: grafana
      repoURL: https://grafana.github.io/helm-charts
      path: grafana
      targetRevision: 10.5.15
      helm:
        valueFiles:
          - $config/monitoring/grafana/values.yaml
    - repoURL: https://github.com/KacperKafara/argocd.git
      targetRevision: victoria
      path: monitoring/grafana
      ref: config
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: monitoring
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  project: monitoring